[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pulse-desk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite==0.22.1",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "certifi==2026.4.22",
    "click==8.3.3",
    "colorama==0.4.6",
    "croniter==6.2.2",
    "fastapi==0.136.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.15",
    "pyaes==1.6.1",
    "pyasn1==0.6.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "pydantic_core==2.46.4",
    "python-dotenv==1.2.2",
    "rsa==4.9.1",
    "starlette==1.0.0",
    "Telethon==1.43.2",
    "tzdata==2026.2",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "uvicorn==0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.28",
    "ruff>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["sessions", "data", "backups", "logs", ".venv"]

[tool.ruff.lint]
# High-signal rules only for the initial gate: real bugs (pyflakes F) and
# genuine pycodestyle errors/warnings. Cosmetic churn (import sorting I,
# pyupgrade UP) is deliberately left out so the gate stays green on the
# existing codebase and can be tightened later in a dedicated cleanup.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length — not worth reflowing a working codebase
    "E402",  # module imports after code: intentional (routers load after app init; sys.path shims)
    "E731",  # lambda fallback stubs in database/_core.py are deliberate
]

[tool.ruff.lint.per-file-ignores]
"database/__init__.py" = ["F401", "F403"]  # public-API re-export hub
"__init__.py" = ["F401"]
